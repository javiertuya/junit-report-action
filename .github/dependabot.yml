version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 20
    # Do not rely on the auto heuristic: always bump the requirement in package.json, not only the lock
    versioning-strategy: increase

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 20
